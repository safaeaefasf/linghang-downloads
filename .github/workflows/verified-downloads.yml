name: Mirror verified downloads
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verified-download-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: downloads-20261115
      RELEASE_ID: "445803395"
    steps:
      - name: Check exact draft before fetching
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" |
            jq -e --arg tag "$RELEASE_TAG" '
              .id == 445803395 and .tag_name == $tag and .draft == true
              and .target_commitish == "170a826e84ad0abeaea3ef85db53055aa1ec3e09"
            ' >/dev/null
      - name: Download and verify public binaries and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified-downloads"
          cd "$RUNNER_TEMP/verified-downloads"
          verify() {
            local filename="$1" hash="$2" bytes="$3" remote="${4:-$1}"
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --connect-timeout 15 --max-time 400 --retry 2 --limit-rate 1650k \
              "https://node.linghang.world/downloads/$remote" --output "$filename"
            test "$(stat -c %s "$filename")" -eq "$bytes"
            printf '%s  %s\n' "$hash" "$filename" | sha256sum --check --status
            printf '%s %s %s\n' "$filename" "$hash" "$bytes" >> "$RUNNER_TEMP/download-inventory"
            printf 'Verified %s (%s bytes)\n' "$filename" "$bytes"
          }
          verify Linghang-Setup-6.6.1-win-x64.exe 69d143ffda6fa335d154a69e7696828718e9b257166aa3f0385bc0ea98ee7a90 205117952
          verify linghang-6.6.6-android-arm64-release.apk e08a5ad84e331e3dfe28dd541b7d66e2cd2fd4de768ec724eacdc5fbcb4e5a89 96332167
          verify Linghang-6.6.1-macos-universal.dmg e4fa92c7b98da1511b2a3d47ff45632d4148f391369fd48f7657f1d8c3d77991 78342978 Linghang-6.6.1-6060105-macos-universal.dmg
          verify linghang-browser-6.6.3.zip e5c5bc94d6dc41b70ab8fdc4af4e2d16db1b559f6a07458684ec07521cfc5d1c 607504
          verify Linghang-Windows-6.6.1-f5f4a2c-source.zip 4d32f80c015cbb17291bbbfa613439a8d11f8cddf65a1f7ded2bac653dd4d0bf 226325226
          verify Linghang-Windows-6.6.1-f5f4a2c-build-tools.zip a52dfafddf4872c050518f4ba45e3a2bab5052bd29d9262223009ef5821bd1fe 86812
          verify linghang-client-6.6.6-6060605-android-source.zip a1c7354761bd02d09b442919e4654c63c6757c9f46b132c668432fd71a046ab9 165648835
          verify Linghang-macOS-6.6.1-6060105-source.zip 33d3d7dca14076d199d8bdb0299a6d0a00c3a21bd0ec3623cf9f0b8bcbe06d6d 170821981
          verify linghang-browser-6.6.3-source-materials.zip 39b328a6f2fe7e94a3efe42ec1d007e702949f3921d87d228380d350ab0446c8 837062
      - name: Upload, verify, and publish release
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/verified-downloads"
          release_path="repos/$GH_REPO/releases/$RELEASE_ID"
          while read -r filename hash bytes; do
            release="$(gh api "$release_path")"
            jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == true' <<< "$release" >/dev/null
            if jq -e --arg name "$filename" '.assets | any(.name == $name)' <<< "$release" >/dev/null; then
              jq -e --arg name "$filename" --arg hash "sha256:$hash" --argjson bytes "$bytes" '
                .assets | any(.name == $name and .digest == $hash and .size == $bytes and .state == "uploaded")
              ' <<< "$release" >/dev/null
            else
              curl --fail --silent --show-error --connect-timeout 20 --max-time 320 \
                --request POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" -H "Content-Type: application/octet-stream" \
                --data-binary @"$filename" \
                "https://uploads.github.com/$release_path/assets?name=$filename" |
                jq -e --arg name "$filename" --argjson bytes "$bytes" \
                  '.name == $name and .size == $bytes and .state == "uploaded"' >/dev/null
            fi
            printf 'Stored %s\n' "$filename"
          done < "$RUNNER_TEMP/download-inventory"
          release="$(gh api "$release_path")"
          while read -r filename hash bytes; do
            jq -e --arg name "$filename" --arg hash "sha256:$hash" --argjson bytes "$bytes" '
              .assets | any(.name == $name and .digest == $hash and .size == $bytes and .state == "uploaded")
            ' <<< "$release" >/dev/null
          done < "$RUNNER_TEMP/download-inventory"
          jq -e '.assets | length == 9' <<< "$release" >/dev/null
          gh api --method PATCH "$release_path" -F draft=false -f make_latest=true |
            jq -e --arg tag "$RELEASE_TAG" 'select(.tag_name == $tag and .draft == false) | {html_url, tag_name, assetCount: (.assets | length)}'
